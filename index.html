<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Poker Trainer — learn Texas Hold'em, Omaha and Short Deck from beginner to winning player. Drills, a real table with AI opponents, and a coach that checks every decision.">
  <meta name="theme-color" content="#0a0e15">
  <title>Poker Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230d3b28'/><text y='74' x='50' font-size='72' text-anchor='middle' fill='%23e3b23c'>%E2%99%A0</text></svg>">
  <!-- Fonts travel with the app (src/fonts), so it looks the same offline
       and nothing is fetched from a third party on every open. Rye is
       preloaded because the first thing on screen is a river of place names
       in it; the rest arrive with the stylesheet. -->
  <link rel="preload" href="src/fonts/rye-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/css/fonts.css">
  <!-- The theme has to be on <html> before the first paint, not after the
       module graph has loaded, or every reload flashes the default palette
       and then corrects itself. Reading storage directly duplicates a little
       of profile.js on purpose: a module import here would be deferred and
       lose the race it exists to win. Wrapped because private mode throws on
       the first touch of localStorage. -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('poker-trainer.profile.v1') || '{}');
      var th = (s.settings || {}).theme;
      if (['midnight', 'felt', 'mahogany', 'daylight'].indexOf(th) >= 0) {
        document.documentElement.setAttribute('data-theme', th);
      }
    } catch (e) { /* no storage: the default in themes.css stands */ }
  </script>
  <link rel="stylesheet" href="src/css/themes.css">
  <link rel="stylesheet" href="src/css/base.css">
  <link rel="stylesheet" href="src/css/table.css">
  <link rel="stylesheet" href="src/css/river.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main id="screen">
      <div class="empty">Loading…</div>
    </main>
    <nav class="dock" id="dock" aria-label="Places"></nav>
  </div>
  <div id="ledger-host"></div>
  <div id="toasts"></div>

  <noscript>
    <div style="padding:40px;text-align:center">Poker Trainer needs JavaScript enabled.</div>
  </noscript>

  <script type="module" src="src/js/app.js"></script>
  <script>
    // ES modules cannot load over file://, so say so plainly rather than
    // showing an empty page.
    if (location.protocol === 'file:') {
      document.getElementById('screen').innerHTML =
        '<div class="panel"><h2>Start a local server</h2>' +
        '<p class="muted">Browsers block JavaScript modules opened directly from disk. From the project folder run:</p>' +
        '<pre class="mono" style="background:#0c1219;padding:12px;border-radius:8px">npm start</pre>' +
        '<p class="muted">or <code class="mono">python3 -m http.server 8000</code>, then open ' +
        '<a href="http://localhost:8000">localhost:8000</a>.</p></div>';
    }
  </script>
</body>
</html>
